# CI-ONLY SUDOERS DROP-IN — the diagnosis is measured, not guessed. On GitHub runners (minikube,
# BOTH docker and containerd runtimes) sudo inside this image fails its PAM account phase: strace
# shows the privilege-dropped child that hardened pam_unix forks getting EACCES opening the
# mode-000 /etc/shadow, and pam returns "Authentication service cannot retrieve authentication
# info" (PAM_AUTHINFO_UNAVAIL) — ansible's first task dies and the pod crashloops. The identical
# pod spec, same image DIGEST, provisions cleanly on kind and in plain docker; only this
# environment's fallback path fails. `Defaults !pam_acct_mgmt` skips exactly the failing PAM call;
# sudoers policy itself (who may sudo, NOPASSWD) still applies. The image's /etc/sudoers.d is
# empty (verified in both environments), so mounting over it loses nothing. The filename carries
# no dot: sudoers.d silently ignores entries containing '.'.
apiVersion: v1
kind: ConfigMap
metadata:
  name: splunk-ci-sudoers
data:
  00-ci-no-pam-acct: |
    Defaults !pam_acct_mgmt
---
apiVersion: v1
kind: Pod
metadata:
  name: splunk
spec:
  hostNetwork: true
  # NO root securityContext, and no SPLUNK_USER=root: splunk/splunk:latest hard-refuses
  # `splunk start` as root ("Running Splunk Enterprise as root is deprecated ... use the
  # --run-as-root option"), the image's ansible exposes no run-as-root knob, and the pod
  # crashlooped with exit 2 on the 'Start Splunk via CLI' task. The container's default
  # non-root user completes the playbook cleanly - verified by running the image both
  # ways. All ports are >1024, so hostNetwork needs no root either.
  containers:
  - name: splunk
    image: splunk/splunk:latest
    ports:
    - containerPort: 8000
      hostPort: 8000
      protocol: TCP
    - containerPort: 8088
      hostPort: 8088
      protocol: TCP
    - containerPort: 8089
      hostPort: 8089
      protocol: TCP
    env:
    - name: SPLUNK_START_ARGS
      value: --accept-license
    # Newer splunk/splunk images refuse to start on --accept-license alone: the entrypoint also
    # demands acceptance of the Splunk General Terms, and without it the pod crashloops printing
    # "License not accepted, please adjust SPLUNK_GENERAL_TERMS and/or SPLUNK_START_ARGS". This is
    # the exact flag the container's own error message prescribes; older images ignore it.
    - name: SPLUNK_GENERAL_TERMS
      value: --accept-sgt-current-at-splunk-com
    - name: SPLUNK_PASSWORD
      value: changeme2
    - name: SPLUNK_LAUNCH_CONF
      value: OPTIMISTIC_ABOUT_FILE_LOCKING=1
    volumeMounts:
    - name: ci-sudoers
      mountPath: /etc/sudoers.d
      readOnly: true
  volumes:
  - name: ci-sudoers
    configMap:
      name: splunk-ci-sudoers
      defaultMode: 288  # 0440 — sudoers files must be root-owned and not world-writable
