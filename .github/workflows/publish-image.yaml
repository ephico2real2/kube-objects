# Build the plugin image and publish it to Docker Hub.
#
# CANONICAL COPY. This file is installed into all four forks at
# .github/workflows/publish-image.yaml — it is identical in each, because the four repos share one
# Dockerfile shape and one VERSION-file convention. Edit it here and re-install; do not let the four
# copies drift.
#
# THERE WAS NO UPSTREAM EQUIVALENT. splunk's ci_build_test.yaml builds with `push: false` and runs only
# on pull_request, so it never published anything — whatever pushed the old splunk/* images was internal
# and is not in the repo. This workflow is new, not a port, which is also why it does not inherit
# upstream's retired runners (ubuntu-20.04), deprecated actions (checkout@v2, cache@v1) or the
# `::set-output` syntax GitHub removed.
#
# ACTION VERSIONS ARE KEPT ON THE CURRENT MAJORS, and that is maintenance, not tidiness. GitHub is
# retiring Node 20 on its runners, so anything still on a node20 action emits a deprecation warning now
# and stops working later; every action pinned below runs on node24. codeql-action v3 additionally
# carries its own December 2026 deprecation. When a warning appears in a run, bump the major here and
# redistribute — do not silence it with ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION.
#
# WHY MANUAL BY DEFAULT. These four images carry production telemetry to Splunk. Publishing on every push
# would let an unreviewed commit reach a cluster that pulls a rolling tag. Releases here are deliberate
# acts, so the trigger is workflow_dispatch plus an explicit `image-v*` tag.

name: Publish image

on:
  workflow_dispatch:
    inputs:
      hardening_pass:
        # 'h2' BY DEFAULT ON THIS REPO. h1 was the shell-less pass (frozen as published; source on
        # feat/jq-free). Adding jq + a minimal shell to the same upstream version is a second
        # hardening pass, so the jq-capable default publishes as plain h2 — no variant suffix on
        # the default image — and can never overwrite the h1 tags. Bump to h3 when re-hardening.
        description: 'Hardening pass — h3 is the current default (h2 + relocked gems); h1/h2 frozen'
        required: true
        default: 'h3'
      push:
        # DEFAULT TRUE by operator decision: a dispatch publishes. The scan gate
        # (fail_on_critical, below) still blocks a push on fixable CRITICAL/HIGH findings, so a
        # default dispatch remains safe; set push=false explicitly for a build-and-scan-only run.
        description: 'Push to the registries (default). Set false to build and scan only.'
        type: boolean
        required: true
        default: true
      fail_on_critical:
        description: 'Refuse to push if trivy finds a fixable CRITICAL or HIGH.'
        type: boolean
        required: true
        default: true

  push:
    tags:
      - 'image-v*'

env:
  # Docker Hub account is ephico2real. GitHub is ephico2real2. One letter apart — the wrong one here
  # produces a plausible-looking reference that fails only at pull time, on a cluster.
  REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: ephico2real
  QUAY_REGISTRY: quay.io
  QUAY_NAMESPACE: ephico2real
  PLATFORM: linux/amd64

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    # TWO IMAGES PER RUN, one per Dockerfile. 'standard' is docker/Dockerfile (jq pack only);
    # 'curl' is docker/Dockerfile.curl (jq pack + curl/cat/ls debug tools) and publishes under the
    # '-curl'-suffixed pass (e.g. 1.3.3-h2-curl). fail-fast off so one variant's failure still
    # yields the other's scan evidence.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            dockerfile: ./docker/Dockerfile
            pass_suffix: ''
          - variant: curl
            dockerfile: ./docker/Dockerfile.curl
            pass_suffix: '-curl'
    permissions:
      contents: read
      # Lets the SARIF step publish findings to the repo's Security tab. Least-privilege: the job gets
      # no write access to code, packages or anything else.
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The image name matches the repository name for all four (fluentd-hec, kube-objects, k8s-metrics,
      # k8s-metrics-aggr), so one workflow serves every repo without per-repo configuration.
      #
      # VERSION is a file in the repo root and is the upstream release this fork descends from. The sha is
      # the commit actually being built. Both go in the tag: the version says what it forked from, the sha
      # says exactly which source produced these bytes. See splunk-sck-hardening/IMAGES.md §4.
      - name: Compute identity
        id: id
        run: |
          set -euo pipefail
          IMAGE="${GITHUB_REPOSITORY##*/}"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SHA="$(git rev-parse --short=7 HEAD)"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # Tag form: image-v1.3.3-h2 -> pass h2. Falls back to h1 if the tag omits it.
            PASS="$(printf '%s' "${GITHUB_REF_NAME}" | sed -n 's/.*-\(h[0-9][0-9]*\)$/\1/p')"
            PASS="${PASS:-h1}"
          else
            PASS="${{ inputs.hardening_pass }}"
          fi
          # The variant rides the pass name: standard keeps it bare, curl appends '-curl'.
          PASS="${PASS}${{ matrix.pass_suffix }}"

          # A VERSION file that does not match the chart's declared tag means the chart would pull
          # something this build never produced. Cheap to check, expensive to miss.
          case "$VERSION" in
            "") echo "::error::VERSION file is empty"; exit 1 ;;
          esac

          # THE SCAN GATE IS COMPUTED HERE, NOT INLINE IN THE STEP, because the obvious inline form is
          # wrong in a way that fails open. `${{ (inputs.fail_on_critical == false) && '0' || '1' }}`
          # looks right, but on a TAG PUSH there are no inputs: `inputs.fail_on_critical` is null, and
          # GitHub coerces null and false to the same value, so the comparison is TRUE and the gate
          # resolves to exit-code 0 — disabled on exactly the real releases it exists to protect.
          # Defaulting to enabled, and only disabling on an explicit manual opt-out, fails closed.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ inputs.fail_on_critical }}" = "false" ]; then
            GATE=0
          else
            GATE=1
          fi

          REPO="${{ env.DOCKERHUB_NAMESPACE }}/${IMAGE}"
          {
            echo "image=${IMAGE}"
            echo "version=${VERSION}"
            echo "pass=${PASS}"
            echo "immutable=${REPO}:${VERSION}-${PASS}-g${SHA}"
            echo "rolling=${REPO}:${VERSION}-${PASS}"
            echo "build_version=${VERSION}-${PASS}-g${SHA}"
            echo "gate=${GATE}"
          } >> "$GITHUB_OUTPUT"

          echo "### \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- immutable: \`${REPO}:${VERSION}-${PASS}-g${SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- rolling:   \`${REPO}:${VERSION}-${PASS}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # BUILD FIRST, PUSH LATER — the two are deliberately separate steps.
      #
      # `load: true` puts the image in the runner's local docker so trivy can scan the exact artifact that
      # would be published. Building straight to the registry would mean scanning something already
      # public, which defeats the gate below. Single-platform only, which is why load works here; a
      # multi-arch build cannot be loaded and would need a different shape.
      #
      # build-arg VERSION is not cosmetic: the Dockerfile stamps it into the `version` and `release`
      # LABELs and into ENV VERSION, so `docker inspect` on a running container reports the same identity
      # as its tag. Without it the labels say "null" and a running pod cannot be traced back to a build.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORM }}
          push: false
          load: true
          tags: |
            ${{ steps.id.outputs.immutable }}
            ${{ steps.id.outputs.rolling }}
          build-args: |
            VERSION=${{ steps.id.outputs.build_version }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # THE WHOLE POINT OF THIS FORK IS CVE REDUCTION, so publishing without scanning would be
      # self-defeating. The gate is on FIXABLE findings (`--ignore-unfixed`) because that is the only
      # thing a rebuild can act on: the UBI base carries thousands of findings with no upstream fix, and
      # failing on those would mean the workflow could never pass, which trains everyone to disable it.
      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # The action pins the trivy BINARY, and its default is stale (v0.70.0 for action
          # v0.36.0). An old scanner misses recently-published advisories, so a green gate can
          # mean 'nothing found' or 'nothing looked for'. Pin it explicitly and bump it
          # deliberately; keep it in step with the trivy used locally.
          version: v0.74.0
          image-ref: ${{ steps.id.outputs.immutable }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ steps.id.outputs.gate }}
          scanners: vuln

      # Runs even when the gate above failed, so a failed run still tells you WHAT it found rather than
      # only that it failed. Uploaded as an artifact because the table in the log scrolls away.
      - name: Scan report (always)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # The action pins the trivy BINARY, and its default is stale (v0.70.0 for action
          # v0.36.0). An old scanner misses recently-published advisories, so a green gate can
          # mean 'nothing found' or 'nothing looked for'. Pin it explicitly and bump it
          # deliberately; keep it in step with the trivy used locally.
          version: v0.74.0
          image-ref: ${{ steps.id.outputs.immutable }}
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          scanners: vuln
          exit-code: '0'

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ steps.id.outputs.image }}-${{ steps.id.outputs.version }}-${{ matrix.variant }}
          path: trivy-report.json
          if-no-files-found: warn

      # SARIF goes to the repository's Security tab, which is the difference between a finding someone
      # has to go digging in a log for and one that is visible, deduplicated across runs, and shows when
      # it first appeared and when it was fixed. That history is the whole point of maintaining a fork:
      # without it we cannot tell a NEW regression from a CVE we already knew about and accepted.
      #
      # UNFIXED FINDINGS ARE INCLUDED HERE, deliberately, unlike the push gate above. The gate must only
      # block on things a rebuild can act on, or it would be unpassable. The Security tab has the
      # opposite job: record everything, so an unfixable finding that LATER gets a fix is visible the
      # next time this runs rather than silently missed.
      #
      # CRITICAL,HIGH ONLY — MEDIUM IS EXCLUDED BECAUSE IT BROKE THIS. The first version sent
      # CRITICAL,HIGH,MEDIUM and the upload came back with results_count exactly 5000, which is
      # GitHub's per-upload SARIF ceiling, not a coincidence: the UBI base alone carries ~3700 MEDIUM
      # findings. So the upload was SILENTLY TRUNCATED at the cap, and what survived was mostly
      # unfixable MEDIUM vim CVEs — burying the CRITICAL and HIGH entries this exists to surface, and
      # making the first-seen/fixed history meaningless because the set is arbitrary. CRITICAL+HIGH is
      # ~220 for the base: comfortably under the cap, and every entry is worth a human look.
      - name: Scan (SARIF for the Security tab)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # The action pins the trivy BINARY, and its default is stale (v0.70.0 for action
          # v0.36.0). An old scanner misses recently-published advisories, so a green gate can
          # mean 'nothing found' or 'nothing looked for'. Pin it explicitly and bump it
          # deliberately; keep it in step with the trivy used locally.
          version: v0.74.0
          image-ref: ${{ steps.id.outputs.immutable }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '0'

      - name: Publish SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-${{ matrix.variant }}

      # SKOPEO, NOT `docker push`, AND THE CREDENTIALS ARRIVE LAST.
      #
      # Nothing is logged in until the scan above has passed, so registry credentials are never in the
      # environment while an untrusted dependency tree is being built. skopeo takes them per-invocation
      # via --dest-creds rather than writing a config file, which keeps that property.
      #
      # WHY skopeo RATHER THAN docker push. The first copy moves the image out of the local daemon; the
      # second is REGISTRY-TO-REGISTRY, so quay pulls the blobs from Docker Hub directly instead of the
      # runner re-uploading a 1.1 GB image a second time. It also copies the manifest verbatim, so both
      # registries hold the SAME DIGEST — a cluster pulling from quay and one pulling from Docker Hub
      # are provably running identical bytes, which a second `docker push` cannot promise.
      #
      # skopeo is preinstalled on ubuntu-latest.
      - name: Push to Docker Hub
        if: ${{ inputs.push == true || github.event_name == 'push' }}
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          for ref in "${{ steps.id.outputs.immutable }}" "${{ steps.id.outputs.rolling }}"; do
            echo "--> ${REGISTRY}/${ref}"
            skopeo copy --all \
              --dest-creds "${DH_USER}:${DH_PASS}" \
              "docker-daemon:${ref}" "docker://${REGISTRY}/${ref}"
          done

          DIGEST="$(skopeo inspect --no-tags --creds "${DH_USER}:${DH_PASS}" \
            "docker://${REGISTRY}/${{ steps.id.outputs.immutable }}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["Digest"])')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          {
            echo "- docker hub: \`${{ steps.id.outputs.immutable }}\`"
            echo "- digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        id: dockerhub

      # Mirrored, not rebuilt. Same digest by construction — see the note above.
      # Skipped rather than failed when QUAY_USERNAME is unset, so a fork without quay credentials
      # still publishes to Docker Hub instead of going red on a registry it was never given access to.
      - name: Mirror to Quay
        if: ${{ (inputs.push == true || github.event_name == 'push') && env.QUAY_USER != '' }}
        env:
          QUAY_USER: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASS: ${{ secrets.QUAY_TOKEN }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC_IMMUTABLE="${{ steps.id.outputs.immutable }}"
          SRC_ROLLING="${{ steps.id.outputs.rolling }}"
          for ref in "${SRC_IMMUTABLE}" "${SRC_ROLLING}"; do
            dest="${ref/${DOCKERHUB_NAMESPACE}\//${QUAY_NAMESPACE}/}"
            echo "--> ${QUAY_REGISTRY}/${dest}"
            skopeo copy --all \
              --src-creds "${DH_USER}:${DH_PASS}" \
              --dest-creds "${QUAY_USER}:${QUAY_PASS}" \
              "docker://${REGISTRY}/${ref}" "docker://${QUAY_REGISTRY}/${dest}"
          done

          QD="$(skopeo inspect --no-tags --creds "${QUAY_USER}:${QUAY_PASS}" \
            "docker://${QUAY_REGISTRY}/${SRC_IMMUTABLE/${DOCKERHUB_NAMESPACE}\//${QUAY_NAMESPACE}/}" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["Digest"])')"
          echo "- quay: \`${QUAY_REGISTRY}/${SRC_IMMUTABLE/${DOCKERHUB_NAMESPACE}\//${QUAY_NAMESPACE}/}\`" >> "$GITHUB_STEP_SUMMARY"

          # The mirror is only useful if it is genuinely the same image. Prove it rather than assume it.
          if [ "${QD}" != "${{ steps.dockerhub.outputs.digest }}" ]; then
            echo "::error::digest mismatch — docker hub ${{ steps.dockerhub.outputs.digest }} vs quay ${QD}"
            exit 1
          fi
          echo "digests match: ${QD}"

      - name: Not pushed
        if: ${{ inputs.push != true && github.event_name != 'push' }}
        run: echo "::notice::Built and scanned only. Re-run with push=true to publish."
