name: CI Build Test

# THIS WORKFLOW NEVER RAN. The trigger was `pull_request` only, and this fork pushes straight to
# develop — so the unit tests and the minikube+Splunk functional test, which are the only things that
# prove telemetry still reaches Splunk, sat dormant through the entire hardening. A vulnerability scan
# says the image is not KNOWN-VULNERABLE; only this says it still WORKS.
on:
  push:
    branches:
      - develop
      - 'harden/**'
  pull_request:
    branches-ignore:
      - /^release\/.*/
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: '3.3'

      - name: Install dependencies
        run: |
          ci_scripts/install_dep.sh

      - name: Builder
        run: |
          bundle exec rake build -t -v
          cp -R pkg /tmp

      - name: Cache pkg
        uses: actions/cache@v4
        with:
          path: /tmp
          key: ${{ runner.os }}-build

  unit-test:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # This job previously ran against whatever Ruby the runner happened to ship, while `build` used
      # setup-ruby — so the tests could pass or fail on a different interpreter than the one that built
      # the gem, and than the 3.3 in the image we ship.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        run: |
          ci_scripts/install_dep.sh

      - uses: actions/cache@v4
        with:
          path: /tmp
          key: ${{ runner.os }}-build

      - name: Run unit tests
        run: |
          bundle exec rake test -t -v

  func-test:
    needs:
      - unit-test
    runs-on: ubuntu-latest
    # BACKSTOP. Every wait below is individually bounded, but deploy_connector.sh waits for the pod
    # count in an unbounded loop — if an image can never be pulled, the job would otherwise sit at
    # GitHub's 6-hour default before anyone noticed. A healthy run of this shape takes ~15 minutes,
    # so an hour is generous without being open-ended. (ONE key only: two commits each added their
    # own timeout-minutes and the duplicate made the whole workflow file invalid — Actions refuses
    # to parse it, so nothing runs at all.)
    timeout-minutes: 60
    env:
      CI_SPLUNK_PORT: 8089
      CI_SPLUNK_USERNAME: admin
      CI_SPLUNK_HEC_TOKEN: a6b5e77f-d5f6-415a-bd43-930cecb12959
      CI_SPLUNK_PASSWORD: changeme2
      CI_INDEX_EVENTS: ci_events
      CI_INDEX_OBJECTS: ci_objects
      CI_INDEX_METRICS: ci_metrics
      # minikube v1.38.1 refuses anything below v1.28.0 ("Exiting due to K8S_OLD_UNSUPPORTED",
      # exit 106), so upstream's v1.23.2 can no longer start at all. v1.34 is the newest
      # upstream-supported minor that is still at or below minikube's newest-TESTED version
      # (v1.35.1) — no floor error, no "newer than newest supported" warning, and no --force,
      # which would poison exactly the signal this test exists to produce. This variable also
      # pins the kubectl download below.
      KUBERNETES_VERSION: v1.34.11
      # Pinned, not `latest`: a new minikube release can move the supported-Kubernetes floor
      # (exactly how v1.23.2 died), turning this job red with nothing in the repo changed.
      # These two versions are a pair — bump them together, keeping KUBERNETES_VERSION inside
      # the pinned minikube's window.
      MINIKUBE_VERSION: v1.38.1
      MINIKUBE_NODE_COUNTS: 1
      GITHUB_ACTIONS: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare container build
        id: prep
        run: |
          VERSION=`cat VERSION`
          TAGS=ephico2real/kube-objects:recent
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build multi-arch kubernetes-metrics image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.prep.outputs.tags }}
          build-args: VERSION=${{ steps.prep.outputs.version }}

      - name: Check kube-objects image
        run: |
          docker image ls

      - name: Setup Minikube
        run: |
          # Install Kubectl. dl.k8s.io is the canonical host; the old kubernetes-release GCS
          # bucket was frozen and never received the newer releases. -f makes an HTTP error fail
          # the step instead of saving an error page as the "binary".
          curl -fsSLo kubectl https://dl.k8s.io/release/${KUBERNETES_VERSION}/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          mkdir -p ${HOME}/.kube
          touch ${HOME}/.kube/config
          # Install Minikube
          curl -Lo minikube https://storage.googleapis.com/minikube/releases/${MINIKUBE_VERSION}/minikube-linux-amd64
          chmod +x minikube
          sudo mv minikube /usr/local/bin/
          # Start Minikube and Wait.
          # DOCKER RUNTIME, DELIBERATELY — a containerd attempt is REVERTED here, with the story
          # recorded so nobody retries it: containerd was tried as a fix for the splunk pod's sudo
          # failure ("PAM account management error"), did NOT fix it (the real fix is the sudoers
          # drop-in in ci_scripts/k8s-splunk.yml, which is runtime-agnostic), and broke 101 func
          # tests in one run: container-log tests, because containerd writes CRI-format logs while
          # this suite's values assume docker json; and the kubelet-stats metrics tests, which are
          # calibrated against the docker runtime's stats surface. The func-test suite is docker-
          # runtime-shaped; keep the runtime matching it.
          minikube start --driver=docker --container-runtime=docker --cpus 2 --memory 4096 --kubernetes-version=${KUBERNETES_VERSION} --no-vtx-check -n=${MINIKUBE_NODE_COUNTS}
          export JSONPATH='{range .items[*]}{@.metadata.name}:{range @.status.conditions[*]}{@.type}={@.status};{end}{end}'
          # BOUNDED. `until ...; do sleep 1; done` with no ceiling is how this job hung for 18 minutes
          # with no output and would have run to the 6-hour limit.
          deadline=$(( $(date +%s) + 300 ))
          until kubectl get nodes -o jsonpath="$JSONPATH" 2>&1 | grep -q "Ready=True"; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::no node reached Ready within 300s"
              kubectl get nodes -o wide || true
              kubectl describe nodes | tail -40 || true
              exit 1
            fi
            sleep 2
          done

      - name: Install Splunk
        run: |
          # Wait until minikube is ready
          export JSONPATH='{range .items[*]}{@.metadata.name}:{range @.status.conditions[*]}{@.type}={@.status};{end}{end}'
          deadline=$(( $(date +%s) + 300 ))
          until kubectl get nodes -o jsonpath="$JSONPATH" 2>&1 | grep -q "Ready=True"; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::no node reached Ready within 300s"
              kubectl get nodes -o wide || true
              exit 1
            fi
            echo "wait for minikube ready ..."
            sleep 2
          done
          kubectl get nodes
          deadline=$(( $(date +%s) + 120 ))
          until kubectl get sa | grep -q 'default'; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::default ServiceAccount never appeared within 120s"
              kubectl get sa -A || true
              exit 1
            fi
            sleep 2
          done
          # Install Splunk on minikube
          kubectl apply -f ci_scripts/k8s-splunk.yml
          # Wait until splunk is ready
          # THIS IS THE LOOP THAT HUNG. The splunk pod sat in ContainerCreating and the loop polled
          # it every second, forever, printing only "Error from server (BadRequest): container splunk
          # is waiting to start" — which is the LOOP's error, not a diagnosis. Splunk pulls a ~2 GB
          # image and then runs an Ansible playbook, so 10 minutes is generous but finite; on timeout
          # dump what actually went wrong instead of leaving someone to guess.
          deadline=$(( $(date +%s) + 600 ))
          until kubectl logs splunk --tail=2 2>/dev/null | grep -q 'Ansible playbook complete'; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::splunk did not finish its Ansible playbook within 600s"
              echo "--- pod ---";      kubectl get pod splunk -o wide || true
              echo "--- describe ---"; kubectl describe pod splunk | tail -50 || true
              echo "--- events ---";   kubectl get events --sort-by=.lastTimestamp | tail -30 || true
              echo "--- logs ---";     kubectl logs splunk --tail=80 || true
              echo "--- nodes ---";    kubectl top nodes 2>/dev/null || kubectl get nodes -o wide || true
              exit 1
            fi
            printf '.'
            sleep 5
          done
          echo
          export CI_SPLUNK_HOST=$(kubectl get pod splunk --template={{.status.podIP}})
          # Setup Indexes
          curl -k -u $CI_SPLUNK_USERNAME:$CI_SPLUNK_PASSWORD https://$CI_SPLUNK_HOST:$CI_SPLUNK_PORT/services/data/indexes -d name=$CI_INDEX_EVENTS -d datatype=event
          curl -k -u $CI_SPLUNK_USERNAME:$CI_SPLUNK_PASSWORD https://$CI_SPLUNK_HOST:$CI_SPLUNK_PORT/services/data/indexes -d name=$CI_INDEX_OBJECTS -d datatype=event
          curl -k -u $CI_SPLUNK_USERNAME:$CI_SPLUNK_PASSWORD https://$CI_SPLUNK_HOST:$CI_SPLUNK_PORT/services/data/indexes -d name=$CI_INDEX_METRICS -d datatype=metric
          curl -k -u $CI_SPLUNK_USERNAME:$CI_SPLUNK_PASSWORD https://$CI_SPLUNK_HOST:$CI_SPLUNK_PORT/services/data/indexes -d name=default-events -d datatype=event
          curl -k -u $CI_SPLUNK_USERNAME:$CI_SPLUNK_PASSWORD https://$CI_SPLUNK_HOST:$CI_SPLUNK_PORT/services/data/indexes -d name=ns-anno -d datatype=event
          curl -k -u $CI_SPLUNK_USERNAME:$CI_SPLUNK_PASSWORD https://$CI_SPLUNK_HOST:$CI_SPLUNK_PORT/services/data/indexes -d name=pod-anno -d datatype=event
          # Enable HEC services
          curl -X POST -u $CI_SPLUNK_USERNAME:$CI_SPLUNK_PASSWORD -k https://$CI_SPLUNK_HOST:$CI_SPLUNK_PORT/servicesNS/nobody/splunk_httpinput/data/inputs/http/http/enable
          # Create new HEC token
          curl -X POST -u $CI_SPLUNK_USERNAME:$CI_SPLUNK_PASSWORD -k -d "name=splunk_hec_token&token=a6b5e77f-d5f6-415a-bd43-930cecb12959&disabled=0&index=default-events&indexes=default-events,$CI_INDEX_METRICS,$CI_INDEX_OBJECTS,$CI_INDEX_EVENTS,ns-anno,pod-anno" https://$CI_SPLUNK_HOST:$CI_SPLUNK_PORT/servicesNS/nobody/splunk_httpinput/data/inputs/http
          # lower the limit to 50MiB. Higher limits throws error 'Search not executed XXXX'
          kubectl exec splunk -- bash -c 'echo -e "\n[diskUsage]\nminFreeSpace = 50" | sudo -n tee -a /opt/splunk/etc/system/local/server.conf >/dev/null'  # sudo: the pod is non-root now; server.conf is not writable by the exec user
          # Restart Splunk
          curl -k -u $CI_SPLUNK_USERNAME:$CI_SPLUNK_PASSWORD https://$CI_SPLUNK_HOST:$CI_SPLUNK_PORT/services/server/control/restart -X POST

      - name: Deploy k8s connector
        run: |
          export CI_SPLUNK_HOST=$(kubectl get pod splunk --template={{.status.podIP}})
          ci_scripts/deploy_connector.sh

      - name: Deploy log generator
        run: |
          cd /opt/splunk-connect-for-kubernetes
          kubectl apply -f test/test_setup.yaml
          sleep 60

      # 3.7 has no build for ubuntu-24.04 in actions/python-versions (its manifest stops at
      # 22.04), so requesting it on ubuntu-latest fails before pip ever runs.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run functional tests
        run: |
          echo "check the pods"
          kubectl get pods -A
          cd /opt/splunk-connect-for-kubernetes
          kubectl get nodes
          export PYTHONWARNINGS="ignore:Unverified HTTPS request"
          export CI_SPLUNK_HOST=$(kubectl get pod splunk --template={{.status.podIP}})
          cd test
          pip install --upgrade pip
          pip install -r requirements.txt
          echo "Running functional tests....."
          python -m pytest \
          	--splunkd-url https://$CI_SPLUNK_HOST:8089 \
          	--splunk-user admin \
          	--splunk-password $CI_SPLUNK_PASSWORD \
            --nodes-count $MINIKUBE_NODE_COUNTS\
          	-p no:warnings -s -n auto
  fossa-scan:
    # FOSSA is Splunk's licence-scanning account and this fork has no FOSSA_API_KEY, so every run
    # failed with "A FOSSA API key was specified, but it is an empty string". continue-on-error stopped
    # it failing the workflow but left a permanently red job, and a check that is always red is a check
    # nobody reads. The steps below are gated on the key being present, so this goes green-by-skipping
    # until someone sets one.
    #
    # The gate is on the STEPS, not the job: `secrets` is not a valid context in a job-level `if:` and
    # GitHub rejects the entire workflow file with "Unrecognized named-value: 'secrets'".
    continue-on-error: true
    runs-on: ubuntu-latest
    # Declared ONCE at job level. Setting it per-step collided with the env: these steps already had
    # ("'env' is already defined"), which rejects the whole file — and a job-level env is visible to
    # every step's `if:`, which is what the gate needs.
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: run fossa anlyze and create report
        if: ${{ env.FOSSA_API_KEY != '' }}
        run: |
          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash
          fossa analyze  --include-unused-deps --debug
          fossa report attribution --format text > /tmp/THIRDPARTY
      - name: upload THIRDPARTY file
        uses: actions/upload-artifact@v7
        if: ${{ env.FOSSA_API_KEY != '' }}
        with:
          name: THIRDPARTY
          path: /tmp/THIRDPARTY
      - name: run fossa test
        if: ${{ env.FOSSA_API_KEY != '' }}
        run: |
          fossa test --debug
  semgrep:
    runs-on: ubuntu-latest
    name: security-sast-semgrep
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep
        id: semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          publishToken: ${{ secrets.SEMGREP_PUBLISH_TOKEN }}
